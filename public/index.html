<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050507">
  <meta name="description" content="I made this for you babe, I hope you love it😝.">
  <title>For You ❤️</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="topbar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="window-title">Heart Animation</span>
      </div>

      <div class="stage" aria-label="Animated heart made from I love you messages">
        <div id="heart" class="heart"></div>
        <div class="heart-glow"></div>
      </div>

      <div class="controls">
        <button id="playPause" type="button">❚❚</button>
        <label for="speed">Speed</label>
        <input id="speed" type="range" min="0.25" max="3" value="1" step="0.25">
        <span id="speedValue">1x</span>
      </div>

      <div class="message">
        <h1>I love you so much 💕</h1>
        <p>Every little word comes together to make one big feeling.</p>
      </div>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
